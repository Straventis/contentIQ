name: Buffer Data Refresh

on:
  schedule:
    # Every 4 hours, matching the dashboard's default Auto interval.
    # This is a fixed, repo-wide schedule -- an individual visitor's browser
    # preference (see the Update control on the dashboard) cannot change
    # this; only editing this file changes the real cadence. If you want a
    # different interval, edit the cron line below and note the mismatch
    # against the UI default in STRV-62.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    # This is the real "Manual refresh" trigger -- click "Run workflow" on
    # this workflow's Actions tab page. Gated behind your GitHub login,
    # which is exactly the auth boundary the dashboard's "coming soon"
    # message was waiting on, satisfied here by GitHub's own auth instead
    # of a new login system.

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Buffer metrics merge
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/merge_buffer_metrics.py

      - name: Commit and push if data changed
        run: |
          git config user.name "buffer-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/_data/master.csv src/_data/buffer_analytics_raw.csv
          if git diff --cached --quiet; then
            echo "No data changes, skipping commit."
          else
            git commit -m "Automated Buffer metrics refresh ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
          # This push (if it happens) triggers the existing
          # "Build and Deploy ContentIQ" workflow automatically, since that
          # workflow already runs on any push to main. No separate deploy
          # step needed here.
