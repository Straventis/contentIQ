name: Data Refresh

on:
  schedule:
    # Matches contentiq.config.json's update_frequency_hours (currently 4h).
    # Changing the config's number does NOT automatically change this line.
    # Run `python3 scripts/refresh_data.py --show-cron` after editing the
    # config to get the correct cron expression to paste in here.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    # Real "Manual refresh" trigger -- click "Run workflow" on this
    # workflow's Actions tab page. Gated behind your GitHub login.

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install google-genai --break-system-packages

      - name: Run data refresh (source selected by contentiq.config.json)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          TAPLIO_API_KEY: ${{ secrets.TAPLIO_API_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/refresh_data.py

      - name: Commit data changes if any
        id: data_commit
        run: |
          git config user.name "data-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/_data/master.csv
          for f in src/_data/buffer_analytics_raw.csv src/_data/taplio_analytics_raw.csv src/_data/zernio_analytics_raw.csv; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git commit -m "Automated data refresh ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # Note: this push uses the default GITHUB_TOKEN, which per
            # GitHub's own docs will NOT trigger deploy.yml on its own.
            # That's why this same workflow builds and deploys itself
            # below, rather than depending on that cross-trigger.
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Always build and deploy, even if this specific run found no new
      # data -- keeps behavior simple and predictable rather than silently
      # skipping a deploy that a manual "Run workflow" click implied should
      # happen.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Inject real deploy timestamp into the landing page
        run: |
          BUILD_TIME=$(TZ="America/New_York" date "+%B %-d, %Y at %-I:%M %p %Z")
          sed -i "s/__BUILD_TIME__/${BUILD_TIME}/" src/index.html

      - name: Build site with Eleventy
        run: npx @11ty/eleventy

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
