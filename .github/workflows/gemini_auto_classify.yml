name: Auto Classify Missing Pillars via Gemini

on:
  push:
    paths:
      - 'src/_data/master.csv'
      - 'scripts/contentiq_pillars.json'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  classify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pandas python-dotenv requests beautifulsoup4

      - name: Run Gemini Classifier Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/zero-shot-llm-classify_post.py

      - name: Commit and push changes if CSV was updated
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/_data/master.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-classified missing pillars via Gemini" && git push)
